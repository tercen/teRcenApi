# sci#1728 rider: this repo's only CI was the tag-triggered build-and-upload
# package job — nothing ran tests on push/PR. This gate runs the testthat
# suite. The suite stubs the heavy deps (teRcenHttp/tson), so only R6 +
# testthat are needed.
name: "teRcenApi tests"

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  testthat:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
      - name: Install test deps
        run: Rscript -e 'install.packages(c("R6", "testthat"), repos = "https://cloud.r-project.org")'
      - name: Run testthat suite
        run: Rscript -e 'library(testthat); res <- as.data.frame(test_dir("tests/testthat", reporter = ListReporter)); cat("failed:", sum(res$failed), "passed:", sum(res$passed), "\n"); if (sum(res$failed) > 0) quit(status = 1)'
